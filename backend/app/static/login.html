<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 企业人员资产管理后台系统</title>
  <link rel="stylesheet" href="/static/lib/element-plus.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" v-cloak>
  <div class="login-wrap">
    <div class="login-card">
      <h2>企业人员资产管理系统</h2>
      <p class="login-sub">FDE 工程师培训 · 阶段3 登录认证</p>
      <el-form ref="formRef" :model="form" :rules="rules" label-position="top">
        <el-form-item label="账号" prop="username">
          <el-input v-model="form.username" placeholder="请输入账号" size="large" @keyup.enter="submit" />
        </el-form-item>
        <el-form-item label="密码" prop="password">
          <el-input v-model="form.password" type="password" show-password placeholder="请输入密码" size="large" @keyup.enter="submit" />
        </el-form-item>
        <el-button type="primary" size="large" style="width: 100%" :loading="loading" @click="submit">登 录</el-button>
      </el-form>
      <div class="login-tip">
        演示账号：admin / 123456（管理员）<br>
        zhangsan / 123456（普通员工，只读）
      </div>
    </div>
  </div>
</div>

<script src="/static/lib/vue.global.prod.js"></script>
<script src="/static/lib/element-plus.full.min.js"></script>
<script src="/static/lib/element-plus-zh-cn.min.js"></script>
<script src="/static/lib/axios.min.js"></script>
<script src="/static/app.js"></script>
<script>
const { createApp } = Vue;
const { ElMessage } = ElementPlus;

createApp({
  data() {
    return {
      loading: false,
      form: { username: "", password: "" },
      rules: {
        username: [{ required: true, message: "请输入账号", trigger: "blur" }],
        password: [{ required: true, message: "请输入密码", trigger: "blur" }],
      },
    };
  },
  mounted() {
    if (AppAuth.getToken()) {
      window.location.href = "/";
    }
  },
  methods: {
    async submit() {
      try {
        await this.$refs.formRef.validate();
      } catch (e) {
        return;
      }
      this.loading = true;
      try {
        const res = await axios.post("/api/auth/login", this.form);
        AppAuth.setLogin(res.data.data.token, res.data.data.user);
        ElMessage.success("登录成功");
        window.location.href = "/";
      } catch (e) {
        ElMessage.error(AppAuth.errorMsg(e, "登录失败"));
      } finally {
        this.loading = false;
      }
    },
  },
}).use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount("#app");
</script>
</body>
</html>
