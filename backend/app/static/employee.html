<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>员工管理 - 企业人员资产管理后台系统</title>
  <link rel="stylesheet" href="/static/lib/element-plus.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app" v-cloak>
  <div class="layout">
    <aside class="sidebar">
      <div class="logo">资产管理系统</div>
      <a href="/">首页</a>
      <a href="/employee" class="active">员工管理</a>
      <a href="/asset">资产管理</a>
      <a href="/record">领用记录</a>
      <a href="/ai">AI 助手</a>
      <a href="/docs" target="_blank">接口文档</a>
    </aside>
    <div class="main">
      <div class="header">
        <div class="title">员工管理</div>
        <div class="header-right">
          <span class="user-info">{{ userName }}<span class="role-tag">{{ roleName }}</span></span>
          <el-button link type="primary" @click="logout">退出登录</el-button>
        </div>
      </div>
      <div class="content">
        <div class="card">
          <div class="toolbar">
            <div class="left">
              <el-input v-model="searchForm.name" placeholder="按姓名搜索" clearable style="width: 150px" @keyup.enter="search" />
              <el-select v-model="searchForm.department" placeholder="按部门筛选" clearable filterable allow-create style="width: 140px">
                <el-option v-for="d in departments" :key="d" :label="d" :value="d" />
              </el-select>
              <el-select v-model="searchForm.status" placeholder="状态" clearable style="width: 100px">
                <el-option label="在职" value="在职" />
                <el-option label="离职" value="离职" />
              </el-select>
              <el-date-picker
                v-model="dateRange"
                type="daterange"
                value-format="YYYY-MM-DD"
                start-placeholder="入职起"
                end-placeholder="入职止"
                style="width: 240px"
              />
              <el-select v-model="searchForm.sortBy" style="width: 130px">
                <el-option label="默认排序" value="id" />
                <el-option label="按工号" value="emp_no" />
                <el-option label="按姓名" value="name" />
                <el-option label="按入职日期" value="hire_date" />
              </el-select>
              <el-select v-model="searchForm.sortOrder" style="width: 100px">
                <el-option label="降序" value="desc" />
                <el-option label="升序" value="asc" />
              </el-select>
              <el-button type="primary" @click="search">查询</el-button>
              <el-button @click="resetSearch">重置</el-button>
            </div>
            <div class="left">
              <el-button @click="exportExcel" :loading="exporting">导出 Excel</el-button>
              <el-button v-if="isAdmin" type="primary" @click="openAdd">新增员工</el-button>
            </div>
          </div>

          <el-table :data="list" border stripe v-loading="loading" style="width: 100%">
            <el-table-column prop="emp_no" label="工号" width="90" />
            <el-table-column prop="name" label="姓名" width="100" />
            <el-table-column prop="gender" label="性别" width="70" />
            <el-table-column prop="department" label="部门" width="100" />
            <el-table-column prop="position" label="职位" width="120" />
            <el-table-column prop="phone" label="手机号" width="130" />
            <el-table-column prop="email" label="邮箱" min-width="170" show-overflow-tooltip />
            <el-table-column prop="hire_date" label="入职日期" width="110" />
            <el-table-column label="状态" width="80">
              <template #default="scope">
                <el-tag :type="scope.row.status === '在职' ? 'success' : 'info'">{{ scope.row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="附件" width="80">
              <template #default="scope">
                <el-button v-if="scope.row.attachment_name" link type="primary" @click="downloadAttachment(scope.row)">下载</el-button>
                <span v-else>-</span>
              </template>
            </el-table-column>
            <el-table-column v-if="isAdmin" label="操作" width="140" fixed="right">
              <template #default="scope">
                <el-button link type="primary" @click="openEdit(scope.row)">编辑</el-button>
                <el-button link type="danger" @click="remove(scope.row)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>

          <div class="pager">
            <el-pagination
              layout="total, prev, pager, next"
              :total="total"
              :page-size="size"
              :current-page="page"
              @current-change="onPageChange"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <el-dialog v-model="dialogVisible" :title="dialogTitle" width="520px" destroy-on-close>
    <el-form ref="formRef" :model="form" :rules="rules" label-width="90px">
      <el-form-item label="工号" prop="emp_no">
        <el-input v-model="form.emp_no" placeholder="如 E006" />
      </el-form-item>
      <el-form-item label="姓名" prop="name">
        <el-input v-model="form.name" placeholder="请输入姓名" />
      </el-form-item>
      <el-form-item label="性别" prop="gender">
        <el-select v-model="form.gender" style="width: 100%">
          <el-option label="男" value="男" />
          <el-option label="女" value="女" />
        </el-select>
      </el-form-item>
      <el-form-item label="部门" prop="department">
        <el-select v-model="form.department" filterable allow-create style="width: 100%" placeholder="请选择或输入部门">
          <el-option v-for="d in departments" :key="d" :label="d" :value="d" />
        </el-select>
      </el-form-item>
      <el-form-item label="职位" prop="position">
        <el-input v-model="form.position" placeholder="请输入职位" />
      </el-form-item>
      <el-form-item label="手机号" prop="phone">
        <el-input v-model="form.phone" placeholder="请输入手机号" />
      </el-form-item>
      <el-form-item label="邮箱" prop="email">
        <el-input v-model="form.email" placeholder="请输入邮箱" />
      </el-form-item>
      <el-form-item label="入职日期" prop="hire_date">
        <el-date-picker v-model="form.hire_date" type="date" value-format="YYYY-MM-DD" style="width: 100%" placeholder="选择日期" />
      </el-form-item>
      <el-form-item label="状态" prop="status">
        <el-select v-model="form.status" style="width: 100%">
          <el-option label="在职" value="在职" />
          <el-option label="离职" value="离职" />
        </el-select>
      </el-form-item>
      <el-form-item v-if="isEdit" label="附件">
        <div style="width: 100%">
          <div v-if="form.attachment_name" style="margin-bottom: 8px">
            当前附件：
            <el-link type="primary" @click="downloadAttachment(form)">{{ form.attachment_name }}</el-link>
            <el-button link type="danger" @click="removeAttachment">删除附件</el-button>
          </div>
          <el-upload :show-file-list="false" :http-request="uploadAttachment">
            <el-button :loading="uploading">选择文件上传</el-button>
          </el-upload>
          <div class="upload-tip" style="margin-left: 0; margin-top: 6px">支持 pdf/word/excel/图片/txt/zip，不超过 5MB</div>
        </div>
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button @click="dialogVisible = false">取消</el-button>
      <el-button type="primary" :loading="saving" @click="save">保存</el-button>
    </template>
  </el-dialog>
</div>

<script src="/static/lib/vue.global.prod.js"></script>
<script src="/static/lib/element-plus.full.min.js"></script>
<script src="/static/lib/element-plus-zh-cn.min.js"></script>
<script src="/static/lib/axios.min.js"></script>
<script src="/static/app.js"></script>
<script>
const { createApp } = Vue;
const { ElMessage, ElMessageBox } = ElementPlus;

createApp({
  data() {
    return {
      list: [],
      total: 0,
      page: 1,
      size: 10,
      loading: false,
      saving: false,
      uploading: false,
      exporting: false,
      searchForm: { name: "", department: "", status: "", sortBy: "id", sortOrder: "desc" },
      dateRange: [],
      departments: ["技术部", "人事部", "财务部", "市场部", "行政部"],
      dialogVisible: false,
      dialogTitle: "新增员工",
      isEdit: false,
      form: {},
      isAdmin: AppAuth.isAdmin(),
      userName: AppAuth.displayName(),
      roleName: AppAuth.isAdmin() ? "管理员" : "普通员工",
      rules: {
        emp_no: [{ required: true, message: "请输入工号", trigger: "blur" }],
        name: [{ required: true, message: "请输入姓名", trigger: "blur" }],
        phone: [{ pattern: /^1[3-9]\d{9}$/, message: "手机号格式不正确", trigger: "blur" }],
        email: [{ type: "email", message: "邮箱格式不正确", trigger: "blur" }],
      },
    };
  },
  mounted() {
    if (!AppAuth.requireLogin()) {
      return;
    }
    this.loadList();
  },
  methods: {
    buildParams() {
      const params = {
        name: this.searchForm.name,
        department: this.searchForm.department,
        status: this.searchForm.status,
        sort_by: this.searchForm.sortBy,
        sort_order: this.searchForm.sortOrder,
      };
      if (this.dateRange && this.dateRange.length === 2) {
        params.hire_date_start = this.dateRange[0];
        params.hire_date_end = this.dateRange[1];
      }
      return params;
    },
    async loadList() {
      this.loading = true;
      try {
        const res = await axios.get("/api/employee/list", {
          params: Object.assign({ page: this.page, size: this.size }, this.buildParams()),
        });
        this.list = res.data.data.items;
        this.total = res.data.data.total;
      } catch (e) {
        ElMessage.error(AppAuth.errorMsg(e, "加载员工列表失败"));
      } finally {
        this.loading = false;
      }
    },
    search() {
      this.page = 1;
      this.loadList();
    },
    resetSearch() {
      this.searchForm = { name: "", department: "", status: "", sortBy: "id", sortOrder: "desc" };
      this.dateRange = [];
      this.search();
    },
    onPageChange(p) {
      this.page = p;
      this.loadList();
    },
    async exportExcel() {
      this.exporting = true;
      try {
        const res = await axios.get("/api/employee/export", {
          params: this.buildParams(),
          responseType: "blob",
        });
        const url = window.URL.createObjectURL(new Blob([res.data]));
        const link = document.createElement("a");
        link.href = url;
        link.download = "员工数据_" + new Date().toISOString().slice(0, 10) + ".xlsx";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
        ElMessage.success("导出成功");
      } catch (e) {
        ElMessage.error("导出失败");
      } finally {
        this.exporting = false;
      }
    },
    async downloadAttachment(row) {
      try {
        const res = await axios.get("/api/employee/" + row.id + "/attachment", { responseType: "blob" });
        const url = window.URL.createObjectURL(new Blob([res.data]));
        const link = document.createElement("a");
        link.href = url;
        link.download = row.attachment_name || "attachment";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(url);
      } catch (e) {
        ElMessage.error("下载附件失败");
      }
    },
    async uploadAttachment(options) {
      const formData = new FormData();
      formData.append("file", options.file);
      this.uploading = true;
      try {
        const res = await axios.post("/api/employee/" + this.form.id + "/attachment", formData);
        this.form.attachment_name = res.data.data.attachment_name;
        ElMessage.success("附件上传成功");
        this.loadList();
      } catch (e) {
        ElMessage.error(AppAuth.errorMsg(e, "附件上传失败"));
      } finally {
        this.uploading = false;
      }
    },
    removeAttachment() {
      ElMessageBox.confirm("确定删除当前附件吗？", "提示", { type: "warning" })
        .then(async () => {
          try {
            await axios.delete("/api/employee/" + this.form.id + "/attachment");
            this.form.attachment_name = null;
            ElMessage.success("附件已删除");
            this.loadList();
          } catch (e) {
            ElMessage.error(AppAuth.errorMsg(e, "删除附件失败"));
          }
        })
        .catch(() => {});
    },
    openAdd() {
      this.isEdit = false;
      this.dialogTitle = "新增员工";
      this.form = { gender: "男", status: "在职" };
      this.dialogVisible = true;
    },
    openEdit(row) {
      this.isEdit = true;
      this.dialogTitle = "编辑员工";
      this.form = { ...row };
      this.dialogVisible = true;
    },
    async save() {
      try {
        await this.$refs.formRef.validate();
      } catch (e) {
        return;
      }
      this.saving = true;
      try {
        if (this.isEdit) {
          await axios.put("/api/employee/" + this.form.id, this.form);
          ElMessage.success("修改成功");
        } else {
          await axios.post("/api/employee", this.form);
          ElMessage.success("新增成功");
        }
        this.dialogVisible = false;
        this.loadList();
      } catch (e) {
        ElMessage.error(AppAuth.errorMsg(e, "保存失败"));
      } finally {
        this.saving = false;
      }
    },
    remove(row) {
      ElMessageBox.confirm("确定删除员工「" + row.name + "」吗？", "提示", {
        type: "warning",
        confirmButtonText: "确定",
        cancelButtonText: "取消",
      })
        .then(async () => {
          try {
            await axios.delete("/api/employee/" + row.id);
            ElMessage.success("删除成功");
            if (this.list.length === 1 && this.page > 1) {
              this.page -= 1;
            }
            this.loadList();
          } catch (e) {
            ElMessage.error(AppAuth.errorMsg(e, "删除失败"));
          }
        })
        .catch(() => {});
    },
    logout() {
      AppAuth.logout();
    },
  },
}).use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount("#app");
</script>
</body>
</html>
